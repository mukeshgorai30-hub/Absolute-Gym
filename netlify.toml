[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API calls to Netlify Functions when deployed on Netlify
[[redirects]]
  from = "/api/ai/fitness-plan"
  to = "/.netlify/functions/fitness-plan"
  status = 200

# Single Page Application (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
